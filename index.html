<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Central do CO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#150958; --navy-2:#221670; --navy-3:#2E2380; --blue:#009EDB; --blue-soft:#E3F4FB; --lilac:#53529D; --sky:#82D5F3;
  --bg:#F2F3F8; --surface:#FFFFFF; --line:#E1E3EE; --line-2:#ECEDF4; --text:#1B1740; --muted:#5E5B7A;
  --ok:#1E8E5A; --ok-bg:#E4F4EC; --warn:#B26A00; --warn-bg:#FFF2DC; --crit:#C23B3B; --crit-bg:#FBE6E6;
  --evo:#2C6FB0; --evo-bg:#E6EFF9;
  --r:8px; --r-sm:6px; --side:236px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ===== App shell ===== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100%}
.sidebar{background:var(--navy);color:#DCD9F5;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--blue);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.logo b{display:block;color:#fff;font-size:14.5px;font-weight:600;line-height:1.2}
.logo small{display:block;color:#A9A5D3;font-size:11.5px}
.nav-label{font-size:11.5px;color:#8A85C0;padding:14px 10px 6px;font-weight:500}
.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#DCD9F5;padding:9px 10px;border-radius:var(--r-sm);text-align:left;font-size:13.5px;font-weight:500}
.nav button:hover{background:var(--navy-2)}
.nav button[aria-current="page"]{background:var(--navy-3);color:#fff}
.nav button[aria-current="page"] svg{color:var(--sky)}
.nav svg{width:17px;height:17px;flex:none;color:#A9A5D3}
.nav .count{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:1px 7px}
.nav .count.alert{background:#C23B3B}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.user{display:flex;align-items:center;gap:10px;padding:8px 6px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lilac);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.user b{display:block;color:#fff;font-size:13px;font-weight:600;line-height:1.25}
.user small{color:#A9A5D3;font-size:11.5px}
.profile-sel{width:100%;margin-top:6px;background:var(--navy-2);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:var(--r-sm);padding:7px 8px;font-size:12.5px}
.demo{display:block;margin:10px 6px 0;font-size:11px;color:#8A85C0}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top,0px)) 24px 12px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:6px 8px}
.page-title{min-width:0}
.crumb{font-size:12px;color:var(--muted)}
.page-title h1{font-size:18px;font-weight:600;margin:0;color:var(--navy);letter-spacing:-.01em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.week-sel{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;background:#fff;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 8px;font-size:12.5px;font-weight:500;background:#fff}
.ring{width:18px;height:18px}
.pill.ready{background:var(--ok-bg);border-color:#BFE3CF;color:#16583A}
.pill.ro{background:#EEEDF8;border-color:#DAD8F0;color:var(--lilac)}
.btn-send{background:var(--blue);color:#fff;border:0;border-radius:var(--r-sm);padding:8px 14px;font-weight:600;font-size:13px}
.btn-send:disabled{background:#B9DCEB;cursor:not-allowed}
.content{flex:1;overflow-y:auto;padding:22px 24px calc(40px + env(safe-area-inset-bottom,0px))}
.view{max-width:1200px;margin:0 auto}
.view-intro{color:var(--muted);font-size:13px;margin:0 0 16px;max-width:80ch}

/* ===== Common ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.card-h h2{font-size:14.5px;font-weight:600;margin:0;color:var(--navy)}
.card-b{padding:14px 16px}
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px}
.hint{font-size:12.5px;color:var(--muted)}
.source{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.source::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px dashed var(--lilac);flex:none}
.ai-note{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--lilac);background:#EEEDF8;border-radius:99px;padding:2px 10px}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-crit{background:var(--crit-bg);color:var(--crit)}.b-evo{background:var(--evo-bg);color:var(--evo)}
.b-neutral{background:#ECECF4;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:6px 12px;font-size:12.5px;font-weight:500}
.btn:hover{border-color:#BFC2DA}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.primary:hover{background:var(--navy-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--navy);background:#F3F3F9}
.btn.danger:hover{color:var(--crit)}
.btn.add{border-style:dashed;color:var(--lilac)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.done-line{font-size:12.5px;color:var(--ok);font-weight:600}
textarea,input[type=text],input[type=search]{width:100%;border:1px solid #C8CBE0;border-radius:var(--r-sm);padding:8px 10px;line-height:1.55;background:#FCFCFF}
textarea{min-height:84px;resize:vertical}
.field{margin-bottom:10px}
.field label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.mic{display:inline-flex;align-items:center;gap:6px}
.mic svg{width:14px;height:14px}
.mic.on{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.mic.on .rec{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 11px;font-size:12px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.sel{border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 8px;font-size:12.5px;background:#fff}
.sel.s-feito{color:var(--ok)}.sel.s-andamento{color:var(--evo)}.sel.s-parado{color:var(--crit)}
body.lucas .edit-only{display:none!important}
body:not(.lucas) .lucas-only{display:none!important}

/* ===== KPI summary row ===== */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}

/* ===== Table ===== */
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.search{max-width:240px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:#FAFAFD;white-space:nowrap}
th.num,td.num{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.row{cursor:pointer}
tr.row:hover td{background:#F7F8FC}
tr.row.sel td{background:#EEF6FB}
tr.grp td{background:#F6F6FB;font-size:12px;font-weight:600;color:var(--lilac);padding:7px 12px;cursor:default}
.ind-name{font-weight:500}
.kr-tag{font-size:10.5px;font-weight:700;color:var(--navy);background:#E8E6F7;border-radius:4px;padding:1px 5px;margin-left:6px}
.val{font-weight:600;color:var(--navy);white-space:nowrap}
.delta{font-size:12.5px;font-weight:600;white-space:nowrap}
.delta.good{color:var(--ok)}.delta.bad{color:var(--crit)}.delta.flat{color:var(--muted)}
.spark{width:90px;height:26px;display:block}
.meta-cell{color:var(--muted);font-size:12.5px;white-space:nowrap}

/* ===== Drawer ===== */
.scrim{position:fixed;inset:0;background:rgba(21,9,88,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);box-shadow:-12px 0 40px rgba(21,9,88,.18);transform:translateX(100%);transition:transform .25s ease;z-index:31;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer:not(.open){visibility:hidden;box-shadow:none}
.drawer.open{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{font-size:16px;margin:0 0 4px;color:var(--navy)}
.drawer-b{padding:16px 20px;overflow-y:auto}
.chart{width:100%;height:auto;margin:4px 0 8px}
.reading{background:#F6F6FC;border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:14px 0;font-size:13.5px}
dl.facts dt{color:var(--muted)} dl.facts dd{margin:0;font-weight:500}

/* ===== Reporte ===== */
.focus-text{margin:0 0 12px;font-size:14.5px;line-height:1.65;max-width:80ch}
.list-row{padding:13px 16px;border-bottom:1px solid var(--line-2);border-left:3px solid transparent}
.list-row:last-child{border-bottom:0}
.list-row.crit{border-left-color:var(--crit)}.list-row.warn{border-left-color:var(--warn)}.list-row.evo{border-left-color:var(--evo)}
.lr-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.lr-head h3{font-size:14px;font-weight:600;margin:0}
.lr-text{margin:6px 0 10px;color:#34305A;max-width:80ch}
.lr-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.origin{font-size:12px;color:var(--muted)}
.list-row.discarded{opacity:.6;padding:9px 16px}
.list-row.discarded h3{font-weight:500;text-decoration:line-through;color:var(--muted)}
.list-row.accepted{background:#FBFDFC}
.summary-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
.summary-row:last-of-type{border-bottom:0}
.summary-row button{border:0;background:none;color:var(--blue);font-weight:600;font-size:12.5px;padding:0}
.meter{height:6px;background:#ECEDF4;border-radius:99px;overflow:hidden;margin:10px 0 4px}
.meter span{display:block;height:100%;background:var(--blue);transition:width .3s}
.banner{border-radius:var(--r);padding:11px 14px;font-size:13.5px;margin-bottom:16px;background:#FFF8E8;border:1px solid #F1DDB0;color:#6B4A00}
.banner.ready{background:var(--ok-bg);border-color:#BFE3CF;color:#16583A}

/* ===== Frentes ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{border:0;background:transparent;padding:11px 12px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--blue);font-weight:600}
.target{background:var(--blue-soft);border-radius:var(--r-sm);padding:9px 12px;font-size:13.5px}
.target strong{color:var(--navy)}
.stalled{font-size:12px;color:var(--crit);font-weight:600;margin-left:6px;white-space:nowrap}
.goal{padding:12px 16px;border-bottom:1px solid var(--line-2)}
.goal:last-child{border-bottom:0}
.goal.accepted{background:#FBFDFC}
.goal.discarded{opacity:.6}.goal.discarded .goal-text{text-decoration:line-through;color:var(--muted)}
.goal-text{font-weight:500;margin:0}
.goal-basis{font-size:12.5px;color:var(--muted);margin:3px 0 9px}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== Responsivo ===== */
@media (max-width:1080px){ .grid-2{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;bottom:0;left:0;width:var(--side);z-index:40;transform:translateX(-100%);transition:transform .25s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .scrim.nav{opacity:1;pointer-events:auto}
  .menu-btn{display:inline-flex}
  .topbar{padding-left:16px;padding-right:16px}
  .content{padding:16px}
  .top-actions{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== v4 additions ===== */
.nav-label:first-of-type{padding-top:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:6px 12px;font-size:12.5px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.view-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.view-bar .view-intro{margin:0}
.chk{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
.meta-input{width:92px;border:1px solid #C8CBE0;border-radius:var(--r-sm);padding:4px 8px;text-align:right;background:#FCFCFF}
.target-edit{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.reslog{margin:10px 0;border-left:2px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.reslog-item p{margin:4px 0 0;font-size:13.5px;color:#34305A}
.reslog-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--lilac);background:#EEEDF8;border-radius:4px;padding:2px 7px;margin-right:8px;vertical-align:middle}
.lr-head h3{display:flex;align-items:center;flex-wrap:wrap;gap:0}
/* report document */
.doc{max-width:940px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.doc-head{background:var(--navy);color:#fff;padding:20px 26px}
.doc-head small{color:var(--sky);font-size:12px;font-weight:500}
.doc-head h2{color:#fff;font-size:19px;margin:2px 0 4px}
.doc-head p{margin:0;color:#C9C6E8;font-size:13px}
.doc-sec{padding:18px 26px;border-top:1px solid var(--line-2)}
.doc-sec h3{font-size:13px;font-weight:700;color:var(--lilac);text-transform:none;margin:0 0 12px}
.doc-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.doc-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;border-top:3px solid var(--line)}
.doc-card.ok{border-top-color:var(--ok)}.doc-card.warn{border-top-color:var(--warn)}.doc-card.crit{border-top-color:var(--crit)}
.doc-card .n{font-size:12px;color:var(--muted)} .doc-card .v{font-size:19px;font-weight:700;color:var(--navy)}
.doc-card .f{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.doc-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.doc-chart{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.doc-chart b{font-size:13px;color:var(--navy)}
.doc-pt{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin-bottom:12px}
.doc-pt.crit{border-left-color:var(--crit)}.doc-pt.warn{border-left-color:var(--warn)}.doc-pt.evo{border-left-color:var(--evo)}
.doc-pt b{font-size:14px} .doc-pt p{margin:3px 0 0;color:#34305A}
.doc-front{margin-bottom:14px}
.doc-front b{color:var(--navy)}
.doc-front ul{margin:6px 0 0;padding-left:18px}
.doc-empty{color:var(--muted);font-size:13px;margin:0}
.paper-note{max-width:940px;margin:0 auto 12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
/* check-ins */
.ci{border-bottom:1px solid var(--line-2);padding:14px 16px}
.ci:last-child{border-bottom:0}
.ci-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ci-head b{font-size:14.5px}
.ci-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:10px}
.ci-block h4{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.ci-block ul{margin:0;padding-left:18px}
.ci-block.block h4{color:var(--crit)}
.ci-block.help{background:#FFF8E8;border-radius:var(--r-sm);padding:8px 10px}
.ci-block.help h4{color:var(--warn)}
.form-card{max-width:760px}
.form-card .field label{font-size:13px;color:var(--text);font-weight:600}
.form-card .field .hint{display:block;margin-bottom:6px}
.field-row{display:flex;gap:8px;align-items:flex-start}
.field-row textarea{flex:1}
@media (max-width:860px){ .doc-cards{grid-template-columns:repeat(2,minmax(0,1fr))} .doc-charts,.ci-grid{grid-template-columns:1fr} .doc-sec,.doc-head{padding-left:16px;padding-right:16px} }

/* ===== Impressão / PDF ===== */
@media print{
  @page{ margin:14mm }
  body *{ visibility:hidden }
  .doc, .doc *{ visibility:visible }
  .doc{ position:absolute; top:0; left:0; width:100%; max-width:none; border:0; box-shadow:none }
  .doc-head{ -webkit-print-color-adjust:exact; print-color-adjust:exact; background:var(--navy) !important; color:#fff !important }
  .doc-head small, .doc-head p{ color:#DCD9F5 !important }
  .doc-sec{ break-inside:avoid; page-break-inside:avoid }
  .doc-card, .doc-chart, .doc-pt, .doc-front{ break-inside:avoid; page-break-inside:avoid }
  .q-tag, .kr-tag{ -webkit-print-color-adjust:exact; print-color-adjust:exact }
}
</style>
</head>
<body>
<div class="app">

const nf = (v,d) => v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

  if(ind.unit.startsWith('pct')&&max>100)max=100; if(min<0&&Math.min(...vals)>=0)min=0;

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução de ${esc(ind.name)}">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#ECEDF4"/><text x="${L-8}" y="${y(t)+4}" font-size="11" text-anchor="end" fill="#5E5B7A">${esc(fmt(ind,t))}</text>`).join('')}
    <line x1="${L}" x2="${W-R}" y1="${y(ind.meta)}" y2="${y(ind.meta)}" stroke="#53529D" stroke-dasharray="6 5" stroke-width="1.5"/>
    <text x="${W-R}" y="${y(ind.meta)-6}" font-size="11" text-anchor="end" fill="#53529D">meta</text>
    <polyline points="${h.map((v,i)=>x(i)+','+y(v)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>
    ${h.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"><title>${wk[i]}: ${esc(fmt(ind,v))}</title></circle>`).join('')}
    ${wk.map((w,i)=>`<text x="${x(i)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#5E5B7A">${w}</text>`).join('')}</svg>`;
}
function reading(ind){
  const h=ind.h,last=h[h.length-1],prev=h[h.length-2],d8=last-h[0],good8=ind.dir==='up'?d8>0:d8<0;
  let up=0,dn=0; for(let i=h.length-1;i>0;i--){ if(ind.dir==='up'?h[i]>h[i-1]:h[i]<h[i-1])up++; else break; }
  for(let i=h.length-1;i>0;i--){ if(ind.dir==='up'?h[i]<h[i-1]:h[i]>h[i-1])dn++; else break; }
  let t=`Em ${h.length} semanas, ${good8?'melhorou':'piorou'} ${fmtDelta(ind,d8).replace(/^[+−]/,'')}. `;
  if(up>=2)t+=`Vem melhorando há ${up} semanas seguidas. `; else if(dn>=2)t+=`Vem piorando há ${dn} semanas seguidas. `; else if(last===prev)t+='Ficou estável na última semana. ';
  t += indStatus(ind)==='ok' ? 'Está dentro da meta.' : `Distância para a meta: ${fmtDelta(ind,ind.meta-last).replace(/^[+−]/,'')}.`;
  return t;
}
function deltaHtml(ind){ const h=ind.h, d=h[h.length-1]-h[h.length-2], good=ind.dir==='up'?d>0:d<0;

function toggleMic(btn){
  const id=btn.dataset.mic; if(recTarget===id){stopMic();return;} stopMic();

/* ================= Prévia e histórico ================= */
function viewPrevia(){
  const lucas=state.mode==='lucas';
  if(lucas) markRead();
  const note = lucas
    ? (state.ready?`<div class="banner ready">Reporte fechado pela Gabi e guardado no histórico.</div>`:`<div class="banner">A Gabi ainda está revisando. Você vê apenas o que já foi aceito até agora.</div>`)
    : `<div class="paper-note"><span class="hint">Esta é exatamente a versão que o Lucas recebe. Ela mostra só o que você aceitou, os indicadores marcados para o reporte e as decisões.</span>
       ${state.ready?'<span class="badge b-ok">Enviado e guardado no histórico</span>':`<span class="badge b-warn">${pendingCount()} itens a revisar</span>`}</div>`;
  const printBar = `<div class="paper-note"><span class="hint">O PDF é gerado pela função de impressão do próprio navegador, com só o conteúdo do reporte.</span>
    <button type="button" class="btn primary" data-act="print-pdf">Baixar em PDF</button></div>`;
  return `<div class="view">${note}${printBar}${reportDoc(buildSnapshot(),{lucasLink:lucas})}</div>`;
}
function viewHistorico(){
  const rows=state.history.map(h=>`<tr class="row" data-doc="${h.id}" tabindex="0"><td><b style="font-weight:600">${esc(h.week)}</b>${h.id===CURRENT_ID?' <span class="badge b-evo">Atual</span>':''}</td>

    <td class="num">${h.snap.points.length}</td><td class="num">${h.snap.decisions.length}</td><td class="num">${h.snap.inds.length}</td></tr>`).join('');
  return `<div class="view"><p class="view-intro">Cada reporte enviado fica guardado com a versão exata que o Lucas recebeu. Nesta demonstração, as semanas anteriores são fictícias e o reporte desta semana só fica guardado até recarregar a página; o histórico permanente virá com o banco de dados.</p>

  const p=b.dataset.id?state.points.find(x=>x.id==b.dataset.id):null;

    if(act==='discard'){ p.status='descartado'; toast('Ponto descartado.'); }
    if(act==='undo') p.status='pendente';

  const me=state.people.find(x=>x.name==='Guilherme');

    state.projects.splice(0,state.projects.length,...newProjs);
    const d=document.querySelector('.demo'); if(d) d.textContent='Conectado ao Supabase · dados fictícios';
    render();
  }catch(e){ console.error(e); toast('Não consegui ler o banco. Mostrando os dados de demonstração.'); }
}

async function persistProject(pj){
  try{
    if(!pj.dbId){
      const first=(pj.owner||'').toLowerCase();
      let pid=(DB.pessoas.find(p=>p.nome.split(' ')[0].toLowerCase()===first)||{}).id||null;
      if(!pid&&pj.owner){ const np=await sb('pessoas',{method:'POST',prefer:'return=representation',body:{nome:pj.owner,papel:'time'}}); pid=np[0].id; DB.pessoas.push(np[0]); }
      const codigo=(pj.name||'projeto').toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36);
      const r=await sb('projetos',{method:'POST',prefer:'return=representation',body:{codigo,nome:pj.name,tipo_iniciativa:pj.iniciativa,responsavel_pessoa_id:pid,objetivo:pj.objetivo}});
      pj.dbId=r[0].id;
    }
    await sb('projetos_atualizacoes?on_conflict=projeto_id,semana_id',{method:'POST',prefer:'resolution=merge-duplicates',
      body:{projeto_id:pj.dbId,semana_id:DB.semanaId,status:pj.status,progresso:pj.progress,atualizacao_texto:pj.update,atualizado_por:quemEditaId(),atualizado_em:new Date().toISOString(),incluido_no_reporte:pj.inReport}});
    toast('Projeto atualizado e salvo no banco.');
  }catch(e){ dbErro(e); }
}
async function persistProjRep(p){ if(!p.dbId) return; try{ await sb(`projetos_atualizacoes?projeto_id=eq.${p.dbId}&semana_id=eq.${DB.semanaId}`,{method:'PATCH',body:{incluido_no_reporte:p.inReport}}); }catch(e){ dbErro(e); } }
async function persistIndRep(i){ if(!i.dbId) return; try{ await sb(`indicadores_semanais?indicador_id=eq.${i.dbId}&semana_id=eq.${DB.semanaId}`,{method:'PATCH',body:{incluido_no_reporte:i.inReport}}); }catch(e){ dbErro(e); } }
async function persistMeta(i){ if(!i.dbId) return; try{ await sb(`indicadores?id=eq.${i.dbId}`,{method:'PATCH',body:{meta:i.meta}}); }catch(e){ dbErro(e); } }

render();
loadFromDb();
</script>
